---
name: Build and Release Raspberry Pi Images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 1. Build and export the image tarball (verifies it compiles on PRs & main)
      - name: Build Docker image bundle
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=docker,dest=HC-SR501-Presence-Detector.tar
          push: false

      # 2. Upload the compiled tarball as a workflow artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: HC-SR501-Presence-Detector
          path: HC-SR501-Presence-Detector.tar

      # 3. If triggered by a release tag (e.g. v1.0.0), attach to GitHub Release
      - name: Attach image to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: HC-SR501-Presence-Detector.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
